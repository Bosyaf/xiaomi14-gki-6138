name: Xiaomi 14 Saf Kernel (6.1.138)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernelsu_ref:
        description: "KernelSU/SukiSU tag (Varsayılan v4.1.3)"
        required: false
        type: string
        default: "v4.1.3"
      susfs_ref:
        description: "SUSFS commit/tag"
        required: false
        type: string
        default: ""

env:
  PYTHON_VERSION: "3.10"
  GKI_WORKSPACE: "${{ github.workspace }}/gki-build"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 1. Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-swapfile: "true"

      - name: 2. Create 24GB SWAP
        run: |
          echo "🔧 24GB Swap oluşturuluyor..."
          sudo fallocate -l 24G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=24576
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo ""
          echo "=== Bellek + Swap ==="
          free -h
          echo ""
          echo "=== Disk Alanı ==="
          df -h /
          df -h /mnt || true

      - name: 3. Checkout code
        uses: actions/checkout@v4

      - name: 4. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 5. Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git curl wget zip unzip xz-utils openssl rsync patch

      - name: 6. Configure ccache
        run: |
          mkdir -p ~/.cache/bazel ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 7. Patch Python Builder (Warnings + OOM Fix)
        run: |
          echo "🛠️ Python builder'a patch uygulanıyor..."
          
          # Derleyici uyarılarını sustur
          sed -i 's|task_mmu.write_text(content, encoding="utf-8")|task_mmu.write_text(content, encoding="utf-8")\n        with open(self.common_dir / "fs/proc/Makefile", "a") as f:\n            f.write("\\n\\nccflags-y += -Wno-error -Wno-unused-label -Wno-unused-function -Wno-unused-variable\\n")|' .github/workflows/scripts/xiaomi14_builder.py
          
          # OOM FIX: Bazel'a --jobs=2 ekle
          sed -i 's|--config=fast --lto=thin //common:kernel_aarch64_dist|--config=fast --lto=thin --jobs=2 //common:kernel_aarch64_dist|' .github/workflows/scripts/xiaomi14_builder.py
          
          chmod +x .github/workflows/scripts/xiaomi14_builder.py
          echo "✅ Patch tamamlandı"

      - name: 8. Build Xiaomi 14 preset
        run: |
          echo "🔥 Python Builder Başlatılıyor..."
          python3 ./.github/workflows/scripts/xiaomi14_builder.py \
            --workspace "${{ env.GKI_WORKSPACE }}" \
            --kernelsu-ref "${{ github.event.inputs.kernelsu_ref }}" \
            --susfs-ref "${{ github.event.inputs.susfs_ref }}"

      - name: 9. Prepare artifacts
        run: |
          echo "📦 Çıktılar Toplanıyor..."
          mkdir -p artifacts
          cp -r "${{ env.GKI_WORKSPACE }}/android14-6.1-138/out/." artifacts/
          ls -la artifacts

      - name: 10. Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi14-android14-6.1.138
          path: artifacts/*
          if-no-files-found: error
