name: Xiaomi 14 Saf Kernel (6.1.138)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernelsu_ref:
        description: "KernelSU/SukiSU tag (Varsayılan v4.1.3)"
        required: false
        type: string
        default: "v4.1.3"
      susfs_ref:
        description: "SUSFS commit/tag"
        required: false
        type: string
        default: ""

env:
  PYTHON_VERSION: "3.10"
  GKI_WORKSPACE: "/tmp/gki-build"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-swapfile: "true"

      - name: 2. Checkout code
        uses: actions/checkout@v4

      - name: 3. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 4. Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git curl wget zip unzip xz-utils openssl rsync patch

      - name: 5. Configure ccache
        run: |
          mkdir -p ~/.cache/bazel ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 6. Build Xiaomi 14 preset
        run: |
          echo "🔥 Forklanmış Özel Python Builder Başlatılıyor..."
          python3 ./.github/workflows/scripts/xiaomi14_builder.py \
            --workspace "${{ env.GKI_WORKSPACE }}" \
            --kernelsu-ref "${{ github.event.inputs.kernelsu_ref }}" \
            --susfs-ref "${{ github.event.inputs.susfs_ref }}"

      - name: 7. Prepare artifacts
        run: |
          echo "📦 Çıktılar Toplanıyor..."
          mkdir -p artifacts
          cp -r "${{ env.GKI_WORKSPACE }}/android14-6.1-138/out/." artifacts/
          ls -la artifacts

      - name: 8. Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi14-android14-6.1.138
          path: artifacts/*
          if-no-files-found: error
          
